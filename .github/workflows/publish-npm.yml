# Publish @willmruzek/my-toolkit to the public npm registry when a GitHub Release
# is published. The release tag must be v<version> and match package.json "version"
# (for example tag v0.2.0 with "version": "0.2.0").
#
# Publishing uses npm Trusted Publishing (OIDC) from GitHub Actions — no long-lived
# publish token.

name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      HUSKY: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release tag matches package.json version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          pkg_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"
          expected="v${pkg_version}"
          if [ "${RELEASE_TAG}" != "${expected}" ]; then
            echo "Release tag '${RELEASE_TAG}' must be '${expected}' (from package.json version ${pkg_version})."
            exit 1
          fi

      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks
