name: npm publish

# Reusable (**`workflow_call`**): reinstall from **pnpm cache**, **`pnpm publish`**. Trusted
# Publishing workflow file on npmjs: **npm-publish.yml** (pnpm delegates to bundled **npm** for publish).

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Tag or SHA to checkout (same as tag release).
        required: true
        type: string

env:
  HUSKY: '0'

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        # Omit registry-url — Trusted Publishing uses OIDC; registry-url implies NODE_AUTH_TOKEN.
        uses: actions/setup-node@v6
        with:
          node-version: '22.14'
          cache: pnpm
          package-manager-cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks
