name: npm publish

# Reusable (**`workflow_call`**): reinstall, upgrade global **npm** to latest (OIDC / Trusted Publishing),
# then **`pnpm publish`**. Trusted Publishing on npmjs: **npm-publish.yml**.

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Tag or SHA to checkout (same as tag release).
        required: true
        type: string

env:
  HUSKY: '0'
  CI: 'true'

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        # Omit registry-url — setup-node would otherwise wire token-based registry auth (.npmrc).
        uses: actions/setup-node@v6
        with:
          node-version: '22.14'
          cache: pnpm
          package-manager-cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      # Node often ships npm 10.x; Trusted Publishing OIDC needs a current npm (pnpm invokes it on publish).
      - name: Install latest npm
        run: npm install -g npm@latest && npm --version

      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks
